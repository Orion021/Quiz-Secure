<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Iframe — Phase1 180s then Phase2 20s touch guard</title>
<style>
  :root{
    --bg:#071021; --muted:#9fb0bf; --accent:#06b6d4; --danger:#ff6b6b;
  }
  html,body{ height:100%; margin:0; font-family:Inter,system-ui,Roboto,Arial; background:var(--bg); color:#eaf6fb; }
  .wrap{ min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:12px; padding:12px; box-sizing:border-box; }

  h1{ font-size:18px; margin:6px 0; font-weight:600; text-align:center; }

  .controls{ width:95vw; max-width:1100px; display:flex; gap:8px; margin-top:6px; }
  input[type="url"]{
    flex:1; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.06);
    background:rgba(255,255,255,0.02); color:inherit; outline:none;
  }
  button{ padding:10px 12px; border-radius:8px; border:0; background:var(--accent); color:#001; font-weight:700; }

  .infoRow{ width:95vw; max-width:1100px; display:flex; justify-content:space-between; color:var(--muted); font-size:13px; }

  /* iframe container sized 90vw x 90vh */
  .frameOuter{
    width:90vw; height:90vh; max-width:1100px; max-height:1200px;
    border-radius:10px; overflow:hidden; position:relative; background:#04121a;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    display:flex; align-items:center; justify-content:center;
    touch-action:none;
  }
  iframe{ width:100%; height:100%; border:0; display:block; background:white; touch-action:none; -webkit-user-select:none; user-select:none; }

  .emptyNotice{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); padding:16px; text-align:center; pointer-events:none; }

  /* overlay */
  .overlay{
    position:absolute; inset:0; background:linear-gradient(180deg, rgba(2,6,10,0.75), rgba(2,6,10,0.9));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:white; padding:18px; box-sizing:border-box; text-align:center; z-index:50;
  }
  .overlay.hidden{ display:none; }
  .overlay .title{ font-size:20px; font-weight:700; color:var(--danger); }
  .overlay .msg{ color:var(--muted); max-width:90%; }
  .overlay .count{ font-size:36px; font-weight:800; color:var(--accent); }

  @media(min-width:900px){
    .frameOuter{ width:75vw; height:75vh; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Iframe — Phase1 180s → Phase2 20s touch guard</h1>

    <div class="controls">
      <input id="urlInput" type="url" placeholder="Enter URL (https://example.com)">
      <button id="openBtn">Open</button>
      <button id="clearBtn">Clear</button>
    </div>

    <div class="infoRow">
      <div id="phaseLabel">Phase: idle</div>
      <div id="phaseSwitch">Time until Phase 2: —</div>
    </div>

    <div class="frameOuter" id="frameOuter" aria-live="polite">
      <div id="emptyNotice" class="emptyNotice">Iframe is empty. Enter URL and tap Open.</div>

      <iframe id="theFrame" style="display:none" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>

      <div id="overlay" class="overlay hidden" aria-hidden="true">
        <div class="title">Touch the page to continue</div>
        <div class="msg">You moved your finger away. Touch inside the page within the countdown to continue using it.</div>
        <div class="count" id="overlayCountdown">20</div>
        <div class="msg small" style="font-size:13px; color:var(--muted)">If you don't touch in time the page will be cleared.</div>
      </div>
    </div>
  </div>

<script>
(() => {
  // elements
  const openBtn = document.getElementById('openBtn');
  const clearBtn = document.getElementById('clearBtn');
  const urlInput = document.getElementById('urlInput');
  const iframe = document.getElementById('theFrame');
  const emptyNotice = document.getElementById('emptyNotice');
  const frameOuter = document.getElementById('frameOuter');
  const overlay = document.getElementById('overlay');
  const overlayCountdownEl = document.getElementById('overlayCountdown');
  const phaseLabel = document.getElementById('phaseLabel');
  const phaseSwitch = document.getElementById('phaseSwitch');

  // config
  const PHASE1_MS = 180000; // 180 seconds
  const PHASE2_ALLOW = 20.0; // 20 seconds
  const TICK_MS = 100;

  // state
  let sessionActive = false;
  let openTime = null;
  let inPhase2 = false;
  let isTouchingIframe = false;
  let overlayRemaining = PHASE2_ALLOW;
  let mainInterval = null;

  // helpers
  function normalizeUrl(raw){
    if(!raw) return null;
    let s = raw.trim();
    if(!/^https?:\/\//i.test(s)) s = 'https://' + s;
    try { new URL(s); return s; } catch(e) { return null; }
  }

  function setPhaseLabel(p) {
    phaseLabel.textContent = p;
  }
  function updatePhaseSwitchUI() {
    if(!sessionActive || !openTime || inPhase2) {
      phaseSwitch.textContent = 'Time until Phase 2: —';
      return;
    }
    const msLeft = Math.max(0, PHASE1_MS - (Date.now() - openTime));
    phaseSwitch.textContent = 'Time until Phase 2: ' + (msLeft/1000).toFixed(0) + 's';
  }

  // open/clear iframe
  function openUrl() {
    const url = normalizeUrl(urlInput.value || '');
    if(!url) { alert('Please enter a valid URL'); return; }
    iframe.src = url;
    iframe.style.display = 'block';
    emptyNotice.style.display = 'none';
    sessionActive = true;
    openTime = Date.now();
    inPhase2 = false;
    isTouchingIframe = false;
    overlay.classList.add('hidden');
    overlay.setAttribute('aria-hidden','true');
    overlayRemaining = PHASE2_ALLOW;
    setPhaseLabel('Phase 1 (no touch required)');
    startMainInterval();
    // bring iframe into view on mobile
    frameOuter.scrollIntoView({behavior:'smooth', block:'center'});
  }

  function clearIframe() {
    iframe.src = 'about:blank';
    iframe.style.display = 'none';
    emptyNotice.style.display = '';
    sessionActive = false;
    openTime = null;
    inPhase2 = false;
    isTouchingIframe = false;
    overlay.classList.add('hidden');
    overlay.setAttribute('aria-hidden','true');
    overlayRemaining = PHASE2_ALLOW;
    setPhaseLabel('cleared');
    stopMainInterval();
    updatePhaseSwitchUI();
  }

  // show/hide overlay
  function showOverlay() {
    overlay.classList.remove('hidden');
    overlay.setAttribute('aria-hidden','false');
    overlayCountdownEl.textContent = Math.ceil(overlayRemaining);
  }
  function hideOverlay() {
    overlay.classList.add('hidden');
    overlay.setAttribute('aria-hidden','true');
    overlayCountdownEl.textContent = Math.ceil(PHASE2_ALLOW);
  }

  // main interval: handles phase switch and overlay countdown
  function startMainInterval(){
    if (mainInterval) return;
    mainInterval = setInterval(()=>{
      if(!sessionActive) return;

      // Phase switch
      if(!inPhase2 && openTime && (Date.now() - openTime >= PHASE1_MS)) {
        inPhase2 = true;
        overlayRemaining = PHASE2_ALLOW;
        setPhaseLabel('Phase 2 (touch required if you release)');

        // If user is NOT touching iframe at the instant phase2 begins -> show overlay immediately
        if(!isTouchingIframe) {
          showOverlay();
        } else {
          hideOverlay();
        }
      }

      updatePhaseSwitchUI();

      // Only count down overlay in Phase2 when overlay is visible (i.e., when user is not touching)
      if(inPhase2 && !isTouchingIframe) {
        // overlay may already be visible; ensure overlayRemaining decrements
        overlayRemaining -= (TICK_MS / 1000);
        if(overlayRemaining <= 0) {
          // time's up -> clear iframe
          overlayRemaining = 0;
          overlayCountdownEl.textContent = '0';
          clearIframe();
          return;
        } else {
          overlayCountdownEl.textContent = Math.ceil(overlayRemaining);
          // ensure overlay visible
          showOverlay();
        }
      } else {
        // if user is touching or not yet in phase2, keep overlay hidden and reset remaining to full allowance
        overlayRemaining = PHASE2_ALLOW;
        // don't show overlay in phase1
      }
    }, TICK_MS);
  }
  function stopMainInterval(){
    if(mainInterval) { clearInterval(mainInterval); mainInterval = null; }
  }

  // Event handling on iframe element:
  // - pointerdown on iframe -> user touched inside -> hide overlay and mark isTouchingIframe = true
  // - pointerup / pointercancel / pointerleave -> user lifted or left -> mark false; if in phase2 start overlay countdown (handled by ticker)
  // Note: pointer events on iframe element rely on modern browsers. Add touch fallbacks.
  function onIframePointerDown(e) {
    // only primary
    if (e.isPrimary === false) return;
    isTouchingIframe = true;
    hideOverlay();
  }
  function onIframePointerUp(e) {
    // pointer released (possibly still inside element). Mark as not touching.
    isTouchingIframe = false;
    // If phase2 active, overlay will be shown immediately by ticker (or next tick)
  }
  function onIframePointerCancel(e) { isTouchingIframe = false; }
  function onIframePointerLeave(e) { isTouchingIframe = false; }

  // Attach pointer and touch events
  iframe.addEventListener('pointerdown', onIframePointerDown, {passive:true});
  iframe.addEventListener('pointerup', onIframePointerUp, {passive:true});
  iframe.addEventListener('pointercancel', onIframePointerCancel, {passive:true});
  iframe.addEventListener('pointerleave', onIframePointerLeave, {passive:true});
  // touch fallback
  iframe.addEventListener('touchstart', (e)=>{ isTouchingIframe = true; hideOverlay(); }, {passive:true});
  iframe.addEventListener('touchend', (e)=>{ isTouchingIframe = false; }, {passive:true});
  iframe.addEventListener('touchcancel', (e)=>{ isTouchingIframe = false; }, {passive:true});

  // If the user touches the overlay itself we do nothing (they must touch the iframe)
  overlay.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); }, {passive:false});

  // Buttons
  openBtn.addEventListener('click', openUrl);
  clearBtn.addEventListener('click', clearIframe);
  urlInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') openUrl(); });

  // Visibility change: if user leaves app, treat as release (so overlay may show when they return)
  document.addEventListener('visibilitychange', () => {
    if(!sessionActive) return;
    if(document.hidden) {
      isTouchingIframe = false;
    }
  });

  // When iframe loads, we require fresh touch only after phase2 starts. For phase1 nothing changes.
  iframe.addEventListener('load', () => {
    // Reset overlayRemaining in case previously altered
    overlayRemaining = PHASE2_ALLOW;
    // Do not force overlay in phase1
    if(!inPhase2) hideOverlay();
  });

  // init
  (function init(){
    setPhaseLabel('idle');
    updatePhaseSwitchUI();
  })();

})();
</script>
</body>
</html>
