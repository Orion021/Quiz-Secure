<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Guard — Responsive One Miss Limit</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #1e1e1e;
    --panel: #2a2a2a;
    --accent: #06b6d4;
    --danger: #fb7185;
    --text: #f1f1f1;
    --muted: #999;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Roboto', sans-serif;
    overflow: hidden;
  }

  .app {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .quiz-layout {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }

  /* --- Desktop layout --- */
  .quiz-area {
    flex: 0 0 90%;
    height: 95%;
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 3px solid #000;
    box-sizing: border-box;
    border-radius: 10px 0 0 10px;
  }

  iframe {
    width: 98%;
    height: 98%;
    border: 0;
    border-radius: 8px;
    background: #fff;
    display: block;
  }

  .touch-bar {
    flex: 0 0 10%;
    height: 95%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 10px solid var(--danger);
    border-radius: 10px;
    transition: all 0.3s ease;
    box-sizing: border-box;
    padding: 20px 0;
  }

  /* Blink border when idle */
  .touch-bar.blink {
    animation: blinkBorder 1s infinite;
  }
  @keyframes blinkBorder {
    0%,100% { border-color: var(--danger); }
    50% { border-color: transparent; }
  }

  .touch-bar.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    animation: none;
  }

  .timer {
    font-size: 2rem;
    font-weight: 700;
    margin-top: 40px;
    user-select: none;
  }

  .touch-bar.active .timer {
    display: none;
  }

  .touch-text {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 40px;
    user-select: none;
  }

  /* --- Fullscreen overlay --- */
  .fs-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 9999;
  }

  .fs-overlay button {
    margin-top: 12px;
    padding: 10px 18px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #000;
    font-weight: 600;
    cursor: pointer;
  }

  .url-row {
    width: 90vw;
    max-width: 800px;
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .url-row input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: var(--text);
  }

  .url-row button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #000;
    font-weight: 600;
    cursor: pointer;
  }

  .note {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
  }

  /* --- Responsive: Mobile layout --- */
  @media (max-width: 768px) {
    .quiz-layout {
      flex-direction: column;   /* stack vertically */
    }
    .quiz-area {
      flex: 0 0 85%;
      width: 95%;
      height: 80%;
      border-right: none;
      border-bottom: 3px solid #000;
      border-radius: 10px 10px 0 0;
    }
    iframe {
      width: 96%;
      height: 96%;
    }
    .touch-bar {
      flex: 0 0 20%;
      width: 95%;
      height: auto;
      flex-direction: column;
      justify-content: center;
      border: 6px solid var(--danger);
      border-radius: 10px;
      padding: 10px;
    }
    .timer {
      margin-top: 0;
    }
    .touch-text {
      margin-bottom: 0;
    }
  }
</style>
</head>
<body>

<!-- Fullscreen prompt -->
<div id="fsOverlay" class="fs-overlay" style="display:none">
  <h2>Tap or click to enter fullscreen</h2>
  <p>The quiz runs best in fullscreen mode.</p>
  <button id="fsEnterBtn">Enter Fullscreen</button>
</div>

<div class="app">
  <div id="stage">
    <div id="initialUrl" class="url-row">
      <input id="urlInput" type="url" placeholder="https://example.com/quiz">
      <button id="loadBtn">Load Quiz</button>
    </div>
    <div class="note">Enter your quiz URL and start fullscreen.</div>
  </div>
</div>

<script>
(function(){
  const fsOverlay = document.getElementById('fsOverlay');
  const fsEnterBtn = document.getElementById('fsEnterBtn');
  const stage = document.getElementById('stage');
  const loadBtn = document.getElementById('loadBtn');
  const urlInput = document.getElementById('urlInput');

  let iframeEl, touchBar, timerDisplay;
  let mainTimer, monitorTimer;
  const MAIN_SECONDS = 150;     // Phase 1 duration (2.5 min)
  const MONITOR_MS = 20000;    // 20s monitoring timeout
  let mainRemaining = 0, cdMs = MONITOR_MS;
  let phase2 = false, isTouching = false;
  let missCount = 0; // 🔹 Tracks missed 20s windows

  // Fullscreen handling
  function requestFullscreen(){
    const el=document.documentElement;
    if(el.requestFullscreen) return el.requestFullscreen();
    if(el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
    return Promise.reject();
  }
  document.addEventListener('fullscreenchange',()=>{ fsOverlay.style.display=document.fullscreenElement?'none':'flex'; });
  fsEnterBtn.onclick=()=>requestFullscreen().then(()=>fsOverlay.style.display='none');

  // Formatting helpers
  function fmtSecs(s){ if(s<0)s=0; return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
  function fmtMs(ms){ return fmtSecs(Math.ceil(ms/1000));}
  function setCountdown(v){ if(timerDisplay) timerDisplay.textContent=v; }

  // UI setup
  function renderUI(url){
    stage.innerHTML='';
    const layout=document.createElement('div');
    layout.className='quiz-layout';

    // Quiz iframe
    const quiz=document.createElement('div');
    quiz.className='quiz-area';
    iframeEl=document.createElement('iframe');
    iframeEl.src=url;
    iframeEl.setAttribute('sandbox','allow-scripts allow-forms allow-same-origin allow-popups');
    quiz.appendChild(iframeEl);

    // Touch bar
    const touch=document.createElement('div');
    touch.className='touch-bar';
    touch.innerHTML='<div class="timer" id="timerDisplay">--:--</div><div class="touch-text">Touch Here</div>';
    touchBar=touch;
    timerDisplay=touch.querySelector('#timerDisplay');

    layout.append(quiz,touch);
    stage.append(layout);

    bindTouch();
    iframeEl.onload=()=>{ if(!mainTimer) startMain(); };
    setTimeout(()=>{ if(!mainTimer) startMain(); },1000);
  }

  // Phase 1
  function startMain(){
    mainRemaining=MAIN_SECONDS;
    setCountdown(fmtSecs(mainRemaining));
    mainTimer=setInterval(()=>{
      mainRemaining--;
      setCountdown(fmtSecs(mainRemaining));
      if(mainRemaining<=0){ clearInterval(mainTimer); mainTimer=null; startMonitor(); }
    },1000);
  }

  // Phase 2: monitoring
  function startMonitor(){
    phase2=true;
    missCount=0;
    cdMs=MONITOR_MS;
    setCountdown(fmtMs(cdMs));
    touchBar.classList.add('blink');
    let last=Date.now();

    monitorTimer=setInterval(()=>{
      const now=Date.now();
      const delta=now-last;
      last=now;
      if(isTouching) cdMs=MONITOR_MS;
      else cdMs=Math.max(0,cdMs-delta);
      setCountdown(fmtMs(cdMs));
      if(cdMs<=0){
        clearInterval(monitorTimer);
        monitorTimer=null;
        handleTimeout();
      }
    },100);
  }

  // Handles 20s timeout
  function handleTimeout(){
    missCount++;
    if(missCount === 1){
      flashWarning(); // one-time warning
      cdMs=MONITOR_MS;
      setCountdown(fmtMs(cdMs));
      let last=Date.now();
      monitorTimer=setInterval(()=>{
        const now=Date.now(); const delta=now-last; last=now;
        if(isTouching) cdMs=MONITOR_MS; else cdMs=Math.max(0,cdMs-delta);
        setCountdown(fmtMs(cdMs));
        if(cdMs<=0){
          clearInterval(monitorTimer);
          monitorTimer=null;
          handleTimeout(); // 2nd miss
        }
      },100);
    } else {
      clearQuiz(); // second miss ends session
    }
  }

  function flashWarning(){
    touchBar.style.borderColor='var(--danger)';
    touchBar.style.boxShadow='0 0 25px var(--danger)';
    setTimeout(()=>{ touchBar.style.boxShadow='none'; },1500);
  }

  function clearQuiz(){
    if(iframeEl) iframeEl.src='about:blank';
    stage.innerHTML='<div style="color:#999;text-align:center;padding:20px;">Quiz cleared — missed twice (20s each).</div>';
    stopAll();
  }

  function stopAll(){
    if(mainTimer) clearInterval(mainTimer);
    if(monitorTimer) clearInterval(monitorTimer);
    mainTimer=null; monitorTimer=null; phase2=false; isTouching=false; cdMs=MONITOR_MS;
  }

  function bindTouch(){
    const start=(e)=>{
      if(!phase2)return;
      isTouching=true; cdMs=MONITOR_MS;
      touchBar.classList.add('active'); touchBar.classList.remove('blink');
      e?.preventDefault?.();
    };
    const end=()=>{
      if(!phase2)return;
      isTouching=false;
      touchBar.classList.remove('active'); touchBar.classList.add('blink');
    };
    touchBar.addEventListener('mousedown',start);
    window.addEventListener('mouseup',end);
    touchBar.addEventListener('touchstart',start,{passive:false});
    touchBar.addEventListener('touchend',end,{passive:true});
    touchBar.addEventListener('touchcancel',end,{passive:true});
  }

  loadBtn.onclick=(ev)=>{
    ev.preventDefault();
    const raw=urlInput.value.trim();
    if(!raw)return alert('Please enter a URL');
    const url=(raw.startsWith('http://')||raw.startsWith('https://'))?raw:('https://'+raw);
    requestFullscreen()
      .then(()=>{ fsOverlay.style.display='none'; stopAll(); renderUI(url); })
      .catch(()=>{ stopAll(); renderUI(url); fsOverlay.style.display='flex'; });
  };
})();
</script>
</body>
</html>
