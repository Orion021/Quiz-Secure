<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz Guard</title>
  <style>
    :root{
      --bg:#0f1724; --card:#0b1220; --accent:#06b6d4; --muted:#94a3b8; --danger:#fb7185;
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#e6eef6;background:linear-gradient(180deg,#071022 0%, #081426 100%);}
    .app{min-height:100vh;display:flex;flex-direction:column;align-items:center}
    header{height:10vh;min-height:64px;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-sizing:border-box;background:rgba(255,255,255,0.02);backdrop-filter:blur(4px);}
    .title{display:flex;flex-direction:column}
    .title h1{margin:0;font-size:1.1rem;letter-spacing:0.4px}
    .subtitle{font-size:0.85rem;color:var(--muted)}

    .timers{display:flex;gap:16px;align-items:center}
    .timer{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,0.02);min-width:120px;text-align:center}
    .timer .label{font-size:0.75rem;color:var(--muted)}
    .timer .value{font-weight:700;font-size:1.0rem}

    main{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px;box-sizing:border-box}

    .url-card{width:90vw;max-width:980px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:14px;border-radius:14px;box-shadow:0 6px 24px rgba(2,6,23,0.6);display:flex;gap:8px;align-items:center}
    .url-card input{flex:1;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit;font-size:1rem}
    .url-card button{padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:#022;cursor:pointer;font-weight:700}

    .frame-wrap{width:90vw;max-width:980px;height:75vh;display:flex;align-items:center;justify-content:center;}
    iframe{width:100%;height:100%;border-radius:12px;border:1px solid rgba(255,255,255,0.04);box-shadow:0 10px 40px rgba(2,6,23,0.6);}

    .holder{width:90vw;max-width:980px;display:flex;justify-content:center}
    .touch-holder{display:none;user-select:none}
    .touch-pad{width:100%;padding:18px;border-radius:12px;background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(0,0,0,0.02));border:1px dashed rgba(255,255,255,0.04);text-align:center;font-weight:700}
    .touch-pad.active{box-shadow:0 6px 30px rgba(6,182,212,0.12);border-style:solid}

    .progress{height:10px;border-radius:999px;background:rgba(255,255,255,0.03);overflow:hidden;margin-top:8px}
    .bar{height:100%;width:0%}

    .muted-note{font-size:0.85rem;color:var(--muted);margin-top:8px;text-align:center}

    /* responsive tweaks */
    @media (max-width:720px){
      .url-card{padding:12px}
      .timer{min-width:90px}
      header{padding:0 12px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <h1>Quiz Guard</h1>
        <div class="subtitle">Enter a URL below to load it in the protected iframe</div>
      </div>
      <div class="timers">
        <div class="timer">
          <div class="label">Phase</div>
          <div id="phase" class="value">idle</div>
        </div>
        <div class="timer">
          <div class="label">Timer</div>
          <div id="countdown" class="value">--:--</div>
        </div>
      </div>
    </header>

    <main>
      <div class="url-card" role="region" aria-label="URL loader">
        <input id="urlInput" type="url" placeholder="https://example.com" aria-label="URL to load" />
        <button id="loadBtn">Load</button>
      </div>

      <div class="frame-wrap" id="frameWrap">
        <!-- iframe will be injected here -->
        <div id="placeholder" style="color:var(--muted);text-align:center;">No page loaded — enter a URL and press Load</div>
      </div>

      <div class="holder">
        <div class="touch-holder" id="touchHolder">
          <div id="touchPad" class="touch-pad" tabindex="0">Place and hold your finger here during the 20s warning phase</div>
          <div class="progress"><div id="pressBar" class="bar" style="background:linear-gradient(90deg,var(--accent),var(--danger));"></div></div>
          <div class="muted-note">On desktop: click and hold (mouse) continuously. On mobile: touch and hold.</div>
        </div>
      </div>

    </main>
  </div>

<script>
(function(){
  const loadBtn = document.getElementById('loadBtn');
  const urlInput = document.getElementById('urlInput');
  const frameWrap = document.getElementById('frameWrap');
  const placeholder = document.getElementById('placeholder');
  const phaseEl = document.getElementById('phase');
  const countdownEl = document.getElementById('countdown');
  const touchHolder = document.getElementById('touchHolder');
  const touchPad = document.getElementById('touchPad');
  const pressBar = document.getElementById('pressBar');

  let iframe = null;
  let mainTimer = null; // 150s
  let warningTimer = null; // 20s
  let mainRemaining = 0;
  let warningRemaining = 0;
  let holding = false;
  let holdAccum = 0; // ms of current hold during warning

  function formatTime(s){
    if (s < 0) s = 0;
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  function clearIframe(){
    if(iframe){
      iframe.src = 'about:blank';
      frameWrap.innerHTML = '<div style="color:var(--muted);text-align:center;">Iframe cleared — touch holder not held during warning.</div>';
      iframe = null;
    }
    phaseEl.textContent = 'idle';
    countdownEl.textContent = '--:--';
    touchHolder.style.display = 'none';
    clearIntervals();
  }

  function clearIntervals(){
    if(mainTimer){ clearInterval(mainTimer); mainTimer = null; }
    if(warningTimer){ clearInterval(warningTimer); warningTimer = null; }
  }

  function startMainCountdown(){
    mainRemaining = 150; // 2:30 --> 150 seconds
    phaseEl.textContent = 'active';
    countdownEl.textContent = formatTime(mainRemaining);
    touchHolder.style.display = 'none';
    mainTimer = setInterval(()=>{
      mainRemaining -= 1;
      countdownEl.textContent = formatTime(mainRemaining);
      if(mainRemaining <= 0){
        clearInterval(mainTimer);
        mainTimer = null;
        startWarningPhase();
      }
    },1000);
  }

  function startWarningPhase(){
    warningRemaining = 20;
    phaseEl.textContent = 'warning';
    countdownEl.textContent = formatTime(warningRemaining);
    touchHolder.style.display = 'block';
    pressBar.style.width = '0%';
    holdAccum = 0;

    // we will track hold by polling every 100ms
    const interval = 100;
    warningTimer = setInterval(()=>{
      // if user holding, increment holdAccum
      if(holding){ holdAccum += interval; }
      // compute percentage held so far relative to 20000ms
      const pct = Math.min(100, (holdAccum / 20000) * 100);
      pressBar.style.width = pct + '%';

      // tick warningRemaining by 1s only on multiples of interval
      // using simple ms countdown approximation
      if((warningRemaining*1000) % 1000 === 0){} // noop
      // decrement countdown once per 1000ms by tracking elapsed ms

      // use a separate timer for seconds display
      // We'll decrease warningRemaining every 1000ms by counting internal counter
    }, interval);

    // Accurate 1s countdown
    let secondsPassed = 0;
    const secondTicker = setInterval(()=>{
      secondsPassed++;
      warningRemaining = 20 - secondsPassed;
      if(warningRemaining < 0) warningRemaining = 0;
      countdownEl.textContent = formatTime(warningRemaining);
      if(secondsPassed >= 20){
        clearInterval(secondTicker);
        if(!holding || holdAccum < 20000){
          // user didn't hold continuously for full 20s: clear iframe
          clearIntervals();
          // small delay to allow UI to update
          setTimeout(()=>{
            clearIframe();
          },200);
        } else {
          // user successfully held for full 20s
          clearIntervals();
          phaseEl.textContent = 'secure';
          countdownEl.textContent = '00:00';
          // keep iframe as is, hide touch holder after a short confirmation
          setTimeout(()=>{ touchHolder.style.display='none'; pressBar.style.width='100%'; },800);
        }
      }
    },1000);

  }

  function injectIframe(src){
    frameWrap.innerHTML = '';
    iframe = document.createElement('iframe');
    iframe.src = src;
    iframe.sandbox = 'allow-scripts allow-forms allow-same-origin allow-popups';
    iframe.loading = 'lazy';
    iframe.addEventListener('load', ()=>{
      // start 2:30 countdown only when the iframe reports load
      startMainCountdown();
    });
    frameWrap.appendChild(iframe);
  }

  // touch/hold handlers (works for mobile and desktop)
  function startHolding(e){
    e && e.preventDefault && e.preventDefault();
    holding = true;
    touchPad.classList.add('active');
  }
  function stopHolding(e){
    holding = false;
    touchPad.classList.remove('active');
  }

  // Event wiring
  loadBtn.addEventListener('click', ()=>{
    const url = urlInput.value.trim();
    if(!url) return alert('Please enter a URL');
    // normalize http(s)
    const normalized = (url.startsWith('http://') || url.startsWith('https://')) ? url : 'https://' + url;
    // clear any previous state
    clearIntervals();
    touchHolder.style.display = 'none';
    injectIframe(normalized);
  });

  // support Enter to load
  urlInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') loadBtn.click(); });

  // Desktop mouse events
  touchPad.addEventListener('mousedown', (e)=>{ startHolding(e); });
  window.addEventListener('mouseup', (e)=>{ stopHolding(e); });

  // Touch events for mobile
  touchPad.addEventListener('touchstart', (e)=>{ startHolding(e); });
  touchPad.addEventListener('touchend', (e)=>{ stopHolding(e); });
  touchPad.addEventListener('touchcancel', (e)=>{ stopHolding(e); });

  // keyboard accessibility: space or enter to toggle (press+hold style simulated)
  touchPad.addEventListener('keydown', (e)=>{
    if(e.key === ' ' || e.key === 'Enter'){
      startHolding(e);
    }
  });
  touchPad.addEventListener('keyup',(e)=>{ if(e.key===' '|| e.key==='Enter') stopHolding(e); });

})();
</script>
</body>
</html>
