<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Quiz Secure</title>
<style>
  /* Mobile-first styles */
  :root{
    --bg:#071422; --card:rgba(255,255,255,0.02); --muted:#94a3b8; --accent:#06b6d4;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    background:linear-gradient(180deg,#071422 0%, #081827 100%);
    color:#e6eef6;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:12px;
    gap:12px;
  }

  header{ width:100%; max-width:980px; display:flex; justify-content:space-between; align-items:center; }
  h1{ font-size:18px; margin:0; font-weight:600; }

  /* Controls wrapper (initially visible). Will be hidden after open. */
  #controlsWrapper{
    width:90vw; max-width:980px;
    display:flex; gap:8px; align-items:center;
  }
  input[type="url"]{
    flex:1; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.06);
    background:var(--card); color:inherit; outline:none; font-size:15px;
  }
  button{
    padding:9px 12px; border-radius:10px; border:0; background:var(--accent); color:black; font-weight:700;
    font-size:14px;
  }
  #openBtn{ min-width:72px; }
  #clearBtn{ background:#ef4444; color:white; }

  /* Stage layout: iframe + pad stacked (mobile-first: stack vertically) */
  .stage{
    width:90vw; max-width:980px; display:flex; flex-direction:column; gap:12px; align-items:center;
  }

  .frameWrap{
    width:90vw; max-width:980px; height:75vh; border-radius:12px; overflow:hidden; background:#07121a;
    display:flex; align-items:center; justify-content:center; position:relative; border:1px solid rgba(255,255,255,0.03);
  }

  iframe{
    width:90vw; max-width:980px; height:75vh; border:0; display:none; background:white;
  }

  .emptyMsg{ color:var(--muted); padding:18px; text-align:center; }

  /* pad card */
  .padCard{
    width:90vw; max-width:420px; background:var(--card); padding:10px; border-radius:12px; border:1px solid rgba(255,255,255,0.03);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .pad{
    width:180px; height:180px; border-radius:16px; display:flex; align-items:center; justify-content:center; user-select:none;
    touch-action:none; border:2px dashed rgba(255,255,255,0.06); background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  }
  .pad.pressed{ border-style: solid; box-shadow: 0 10px 30px rgba(6,182,212,0.10); transform: translateY(1px); }
  .padLabel{ color:var(--muted); text-align:center; font-size:14px; }

  .infoRow{ width:100%; display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--muted); }

  /* Floating refresh button (visible after URL open). Small show-controls button too. */
  .floatingBtns{
    position:fixed; right:12px; bottom:12px; display:flex; flex-direction:column; gap:8px; z-index:9999;
  }
  .fab{
    background:var(--accent); color:black; border-radius:10px; padding:10px 12px; font-weight:700; border:0;
    box-shadow:0 8px 24px rgba(6,182,212,0.12);
  }
  .smallFab{ background:rgba(0,0,0,0.55); color:#e6eef6; padding:8px 10px; font-weight:600; border-radius:8px; border:0; }

  /* Larger screens: use side-by-side layout */
  @media (min-width:920px){
    .stage{ flex-direction:row; align-items:flex-start; gap:16px; }
    .frameWrap{ flex:1; height:75vh; }
    .padCard{ width:320px; }
    .pad{ width:220px; height:220px; }
    iframe{ width:90vw; height:75vh; }
  }
</style>
</head>
<body>
  <header>
    <h1>Quiz Secure</h1>
    <div id="statusMini" style="font-size:13px;color:var(--muted)">Status: <strong id="stateText">idle</strong></div>
  </header>

  <!-- initial controls: hidden after open -->
  <div id="controlsWrapper">
    <input id="urlInput" type="url" placeholder="Enter URL (https://example.com)" value="https://example.com" />
    <button id="openBtn">Open</button>
    <button id="clearBtn">Clear</button>
  </div>

  <main class="stage">
    <div class="frameWrap" id="frameWrap">
      <div id="emptyNotice" class="emptyMsg">Iframe is empty. Paste a URL and tap Open.</div>
      <iframe id="theFrame" sandbox=""></iframe>
    </div>

    <div class="padCard">
      <div class="pad" id="pad" tabindex="0" aria-label="Touch pad">
        <div style="text-align:center">
          <div style="font-size:30px">🖐️</div>
          <div class="padLabel">Keep finger here</div>
        </div>
      </div>

      <div class="infoRow">
        <div>Phase: <strong id="phaseLabel">—</strong></div>
        <div>Clear in: <strong id="countdown">0.0s</strong></div>
      </div>
      <div style="width:100%;display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:13px;color:var(--muted)">Phase2 in: <span id="phaseSwitchCountdown">—</span></div>
        <div id="logLine" style="font-size:13px;color:#ffb4a2;display:none">hung / retry</div>
      </div>
    </div>
  </main>

  <!-- Floating buttons: hidden until URL opened -->
  <div class="floatingBtns" id="floatingBtns" style="display:none;">
    <button id="refreshBtn" class="fab">Refresh iframe</button>
    <button id="showControlsBtn" class="smallFab">Show controls</button>
  </div>

<script>
(() => {
  /* CONFIG */
  const PHASE1_ALLOW = 120.0; // seconds
  const PHASE2_ALLOW = 20.0;  // seconds
  const PHASE_SWITCH_AFTER_MS = 120000; // 2 minutes
  const TICK_MS = 100;
  // hang detection / reload settings (kept mild)
  const LOAD_HANG_TIMEOUT_MS = 15000;
  const MAX_LOAD_RETRIES = 2;

  /* ELEMENTS */
  const urlInput = document.getElementById('urlInput');
  const openBtn = document.getElementById('openBtn');
  const clearBtn = document.getElementById('clearBtn');
  const controlsWrapper = document.getElementById('controlsWrapper');

  const iframe = document.getElementById('theFrame');
  const emptyNotice = document.getElementById('emptyNotice');
  const stateText = document.getElementById('stateText');

  const pad = document.getElementById('pad');
  const phaseLabel = document.getElementById('phaseLabel');
  const countdownEl = document.getElementById('countdown');
  const phaseSwitchCountdownEl = document.getElementById('phaseSwitchCountdown');
  const logLine = document.getElementById('logLine');

  const floatingBtns = document.getElementById('floatingBtns');
  const refreshBtn = document.getElementById('refreshBtn');
  const showControlsBtn = document.getElementById('showControlsBtn');

  /* STATE */
  let phase = 'idle';
  let currentAllow = PHASE1_ALLOW;
  let untouchedTimer = currentAllow;
  let isPressed = false;
  let tickInterval = null;
  let openTime = null;
  let loadHangTimer = null;
  let loadRetries = 0;
  let lastOpenedUrl = null;

  /* HELPERS */
  function setState(s){ stateText.textContent = s; }
  function showFloating(){ floatingBtns.style.display = 'flex'; }
  function hideFloating(){ floatingBtns.style.display = 'none'; }
  function hideControls(){ controlsWrapper.style.display = 'none'; }
  function showControls(){ controlsWrapper.style.display = 'flex'; }

  function normalizeUrl(raw){
    if (!raw) return null;
    let u = raw.trim();
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    try { new URL(u); return u; } catch(e){ return null; }
  }

  /* IFRAME LOAD & HANG DETECTION */
  function scheduleLoadHangTimer(){
    clearLoadHangTimer();
    loadHangTimer = setTimeout(() => onIframeHang(), LOAD_HANG_TIMEOUT_MS);
  }
  function clearLoadHangTimer(){ if (loadHangTimer){ clearTimeout(loadHangTimer); loadHangTimer = null; } }

  function onIframeHang(){
    logLine.style.display = 'block'; logLine.textContent = `Hang detected — retry ${loadRetries+1}/${MAX_LOAD_RETRIES}`;
    setState('hang-detected');
    loadRetries++;
    if (loadRetries <= MAX_LOAD_RETRIES){
      try { iframe.src = iframe.src; } catch(e){ iframe.src = iframe.getAttribute('src'); }
      scheduleLoadHangTimer();
    } else {
      logLine.textContent = 'Still failing after retries';
      // hide message after a short while
      setTimeout(()=>{ logLine.style.display='none'; }, 3500);
    }
  }

  function loadIframe(url){
    clearLoadHangTimer();
    loadRetries = 0;
    iframe.src = url;
    iframe.style.display = 'block';
    emptyNotice.style.display = 'none';
    setState('loading');
    scheduleLoadHangTimer();
  }

  function clearIframe(){
    iframe.src = 'about:blank';
    iframe.style.display = 'none';
    emptyNotice.style.display = '';
    setState('cleared');
    phase = 'cleared';
    openTime = null;
    currentAllow = PHASE1_ALLOW;
    untouchedTimer = currentAllow;
    stopTicker();
    clearLoadHangTimer();
    hideFloating();
    showControls();
    updateUI();
  }

  function onIframeLoaded(){
    clearLoadHangTimer();
    loadRetries = 0;
    logLine.style.display = 'none';
    setState('iframe loaded');
    // Hide the URL controls when iframe has loaded (per your request)
    hideControls();
    showFloating();
  }

  /* PAD + TWO-PHASE TIMING */
  function enterPhase1(){
    phase = 'phase1';
    currentAllow = PHASE1_ALLOW;
    untouchedTimer = currentAllow;
    openTime = Date.now();
    phaseLabel.textContent = 'Phase 1 (120s)';
    setState('phase1');
  }
  function enterPhase2(){
    phase = 'phase2';
    currentAllow = PHASE2_ALLOW;
    if (untouchedTimer > currentAllow) untouchedTimer = currentAllow;
    phaseLabel.textContent = 'Phase 2 (20s)';
    setState('phase2');
  }

  function resetUntouchedTimer(){ untouchedTimer = currentAllow; updateUI(); }

  function updateUI(){
    countdownEl.textContent = untouchedTimer.toFixed(1) + 's';
    if (phase === 'phase1' && openTime){
      const msLeft = Math.max(0, PHASE_SWITCH_AFTER_MS - (Date.now() - openTime));
      phaseSwitchCountdownEl.textContent = (msLeft/1000).toFixed(1) + 's';
    } else phaseSwitchCountdownEl.textContent = '—';
  }

  function startTicker(){
    if (tickInterval) return;
    tickInterval = setInterval(() => {
      if (phase === 'phase1' && openTime && (Date.now() - openTime >= PHASE_SWITCH_AFTER_MS)){
        enterPhase2();
      }
      if (!isPressed && (phase === 'phase1' || phase === 'phase2')){
        untouchedTimer -= (TICK_MS / 1000);
        if (untouchedTimer <= 0){
          untouchedTimer = 0;
          clearIframe();
          return;
        }
      } else if (isPressed){
        untouchedTimer = currentAllow;
      }
      updateUI();
    }, TICK_MS);
  }

  function stopTicker(){ if (tickInterval){ clearInterval(tickInterval); tickInterval = null; } }

  /* PAD EVENTS */
  function onPressStart(e){
    e.preventDefault();
    if (isPressed) return;
    isPressed = true;
    pad.classList.add('pressed');
    setState('pressed');
    untouchedTimer = currentAllow;
    updateUI();
    startTicker();
  }
  function onPressEnd(e){
    e.preventDefault();
    if (!isPressed) return;
    isPressed = false;
    pad.classList.remove('pressed');
    setState('released');
    startTicker();
  }
  pad.addEventListener('pointerdown', onPressStart);
  pad.addEventListener('pointerup', onPressEnd);
  pad.addEventListener('pointercancel', onPressEnd);
  pad.addEventListener('pointerleave', (e) => { if (isPressed && e.buttons === 0) onPressEnd(e); });
  pad.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'Enter') onPressStart(e); });
  pad.addEventListener('keyup', (e) => { if (e.code === 'Space' || e.code === 'Enter') onPressEnd(e); });

  /* BUTTONS */
  openBtn.addEventListener('click', () => {
    const url = normalizeUrl(urlInput.value);
    if (!url) { alert('Enter a valid URL (http(s)://...)'); return; }
    lastOpenedUrl = url;
    loadIframe(url);
    enterPhase1();
    startTicker();
  });

  clearBtn.addEventListener('click', clearIframe);

  refreshBtn.addEventListener('click', () => {
    if (!lastOpenedUrl) return;
    // simple reload the current iframe src
    try { iframe.src = iframe.src; } catch(e){ iframe.src = iframe.getAttribute('src'); }
    scheduleLoadHangTimer();
    setState('manual refresh');
  });

  showControlsBtn.addEventListener('click', () => {
    showControls();
    hideFloating();
  });

  /* IFRAME EVENTS */
  iframe.addEventListener('load', () => {
    if (!iframe.src || iframe.src.endsWith('about:blank')) return;
    onIframeLoaded();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && isPressed){
      isPressed = false;
      pad.classList.remove('pressed');
      setState('hidden');
    }
    startTicker();
  });

  /* INIT UI */
  function init(){
    phase = 'idle';
    currentAllow = PHASE1_ALLOW;
    untouchedTimer = currentAllow;
    updateUI();
    setState('idle');
    hideFloating();
  }
  init();

})();
</script>
</body>
</html>
